# pop base tmux config (ADR-0199). set-option and bind-key only — re-sourceable.

set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g mouse on
set-option -g mode-keys vi
set-option -g history-limit 50000
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g escape-time 0
set-option -g focus-events on

set-option -g status on
set-option -g status-interval 5
set-option -g status-left-length 20
set-option -g status-right-length 60
set-option -g status-left '[pop] '
set-option -g status-right ' detach: C-a d | %H:%M '
set-option -g status-style 'bg=colour235,fg=colour252'

bind-key p display-popup -E -w 60% -h 60% 'pop project dashboard'
bind-key P display-popup -E -w 60% -h 60% 'cd "$(pop worktree dashboard)" && exec $SHELL'
