# pop base tmux config (ADR-0199). set-option and bind-key only — re-sourceable.

set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g mouse on
set-option -g mode-keys vi
set-option -g history-limit 50000
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g escape-time 0
set-option -g focus-events on

set-option -g status on
set-option -g status-interval 5
set-option -g status-left-length 20
set-option -g status-right-length 60
set-option -g status-left '[pop] '
set-option -g status-right ' F12 to leave (work keeps running) | %H:%M '
set-option -g status-style 'bg=colour235,fg=colour252'

# The way out for someone pop attached into tmux without them asking for tmux.
# C-a d is still bound, but a prefix sequence assumes you know what a prefix is;
# a root-table key does not. detach-client, not kill: the drain the operator came
# here to watch survives, and the pop process that wired stdio into attach-session
# returns, so leaving lands them back in the shell they started from.
# Rude in a server pop does not own — which is why this file only ever reaches a
# user who has no tmux config of their own (ADR-0199 decision 4).
bind-key -n F12 detach-client

bind-key p display-popup -E -w 60% -h 60% 'pop project dashboard'
bind-key P display-popup -E -w 60% -h 60% 'cd "$(pop worktree dashboard)" && exec $SHELL'
# The Config dashboard pairs a key list with a full config preview, so it gets a
# roomier popup than the pickers above (ADR-0202 decision 13).
bind-key C display-popup -E -w 80% -h 80% 'pop config dashboard'
