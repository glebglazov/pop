# pop configuration
# Place this file at ~/.config/pop/config.toml

# Include additional config files (only projects, [work.*], [effort.<agent>],
# [repo."<path>"], [agents.<preset>], workbenches, [workbench] and
# [work.dashboard] are merged; parent and earlier includes win on collision)
# Paths support ~ expansion and are resolved relative to this config file
# includes = ["work.toml", "~/Dev/personal.toml"]

# List of project directories
# Each entry is an object with:
#   - path (required): exact path or glob pattern
#   - display_depth (optional, default 1): number of trailing path segments to show
projects = [
    { path = "~/.local/share/chezmoi" },
    { path = "~/Dev/*/*", display_depth = 2 },
]

# Global custom keybindings for the picker
# Section-specific commands ([project] or [worktree]) override global ones matched by key
# commands = [
#     { key = "ctrl-l", label = "logs", command = "tail -f app.log", exit = false },
# ]

# Exclude the current tmux session from the picker
# exclude_current_session = false

# How to disambiguate projects with the same display name
# Options: "first_unique_segment" (default), "full_path"
# disambiguation_strategy = "first_unique_segment"

# Modifier key for quick-access number shortcuts (1-9) in the picker
# Options: "alt" (default), "ctrl", "disabled"
# quick_access_modifier = "alt"

# [tmux]
# Global-scope only: excluded from the include whitelist and from repo-scope
# surfaces, since a repository that could redirect the socket could start a
# server pop then treats as the user's.
#
# Tmux server socket name every pop command addresses (-L <name>). Defaults to
# "" (unset), which addresses tmux's own default server with no -L flag.
# socket = ""
#
# Path to a user-authored tmux config the Base tmux config sources last, so a
# user running pop's Base tmux config can still keep personal bindings. Pop
# never creates or writes this file.
# include = "~/.config/pop/tmux.conf"

# [integrations]
# AI-agent integration settings, read at repo-integrate time as well as by
# `pop doctor`.
#
# Embedded skills to install (array of skill aliases). Defaults to installing
# both shipped skills.
# skills = ["tasks", "pane"]
#
# Prefix applied to every embedded skill's installed name, so an installed
# skill is named "<prefix><base>". Defaults to "pop-"; set to "" for bare
# base names.
# skills_prefix = "pop-"

# [project]
# Project-picker custom keybindings (override global commands matched by key)
# commands = [
#     { key = "ctrl-l", label = "logs", command = "tail -f app.log", exit = false },
# ]
# Show desktop notifications when a pane becomes unread while in the project picker
# unread_notifications_enabled = false
# How the project dashboard arranges a repository's worktree rows
# "flat" (default): every worktree is its own row, named "<project>/<worktree>"
# "nested": a project's live worktree sessions hang under it as a second level
# worktree_display = "flat"
# How the dashboard orders its rows:
# "unified" (default): one recency timeline, rows with a live session
# interleaved with recently visited but session-less checkouts
# "live-first": rows with a live tmux session group at the bottom of the list,
# next to the prompt where the cursor and the quick-access digits sit; recency
# order is unchanged within each tier
# session_ordering = "unified"

# [worktree]
# Worktree-specific custom keybindings (override global commands matched by key)
# commands = [
#     { key = "ctrl-l", label = "logs", command = "tail -f app.log", exit = false },
# ]
# Show desktop notifications when a pane becomes unread while in worktree view
# unread_notifications_enabled = false

# [workbench]
# Workbenches are named blueprints for a session's tmux windows and pane trees.
# When pick_on_create is on, selecting a project/worktree with no live session and
# at least one resolved Workbench prompts you to pick one (or "<empty>" for a plain
# session) before the session is created. Defaults to off (no prompt).
# pick_on_create = true
#
# order fixes the display sequence of the interactive Workbench lists (the create
# prompt and the `pop workbench prefer` picker). Tokens are the literal
# on-screen labels: Workbench names plus the special options "<empty>" and
# "<reset>". Named tokens front-load in this order; everything unnamed follows in
# the default order ("<empty>", Workbenches in resolution order, "<reset>"). A
# token that resolves to nothing is ignored. With the example below and both
# Workbenches resolved, the preferred picker renders: minimal, <empty>, full-dev,
# <reset>.
# order = ["minimal"]

# [[workbenches]]
# name = "minimal"
# windows = [{ name = "edit", layout = { command = "nvim" } }]

# [[workbenches]]
# name = "full-dev"
# before_apply = ["git pull --ff-only"]
# [[workbenches.windows]]
# name = "edit"
# [workbenches.windows.layout]
# children = "columns"
# panes = [
#     { command = "nvim", focus = true, weight = 2 },
#     { command = "git status", weight = 1 },
# ]

# [repo."~/Dev/personal/pop"]
# Per-repo override blocks, keyed by any checkout path of the repository (the
# key is canonicalized and resolves to the same repository identity for every
# worktree). Accepts the same repo-scope keys as a repo-root .pop/config.toml
# (workbenches, preferred_workbench) plus the two keys that are [repo]-only
# because they name machine topology and can never be committed:
#
# trunk names the checkout that is this repository's Trunk worktree (the fork
# base for managed worktrees).
# trunk = "~/Dev/personal/pop"
#
# turn_cap bounds how many Turns one implementation attempt in this repository
# may spend (claude only; other presets cannot be told).
# turn_cap = 40
#
# preferred_workbench names the repo-default Workbench that auto-applies when
# a session is born for any checkout of this repo.
# preferred_workbench = "full-dev"
#
# workbenches are repo-scope session blueprints, unioned by name across the
# repo-scope ladder; a higher-precedence source overrides a same-named
# blueprint from a lower one.
# workbenches = [{ name = "minimal", windows = [{ name = "edit", layout = { command = "nvim" } }] }]

# A repository can instead declare workbenches and preferred_workbench in a
# committed repo-root .pop/config.toml (not this file) — the same repo-scope
# key set as [repo."<path>"] above, minus trunk and turn_cap, which are
# machine topology and never valid there. The global config.toml keys above
# win on collision; .pop/config.toml only fills in what the user's central
# config leaves unset.

# [pane_monitoring]
# Automatically downgrade unread to clear when the pane is currently
# active (visible and focused). Useful if you're already watching the output.
# dismiss_unread_in_active_pane = false
#
# Ignore set-status calls from specific sources. The tmux global hooks pass
# --source tmux-global. Set this to disable auto-read on tmux navigation
# while still allowing explicit reads from the dashboard.
# ignore_status_from = ["tmux-global"]
#
# Bind a TCP listener for daemon IPC instead of direct state writes. Needed
# for the agent-step Topic derivation pipeline below to run on the daemon
# rather than falling back to the prompt hook.
# tcp_server = false
#
# Pin the monitor daemon's TCP address (host:port). Empty derives it from the
# data dir. A pinned addr is shared across any data dirs using this config, so
# only pin it for single-instance setups (e.g. exposing a fixed port to
# containers).
# addr = "127.0.0.1:4830"
#
# Topic derivation pipeline: an ordered list of typed steps pop runs to derive a
# pane's Topic (ADR 0068). Each step is either type = "truncate" (cheap local
# prompt truncation → a provisional seed) or type = "agent" (a curated agent-CLI
# Topic recipe → a final Topic). A bare string is sugar for
# { type = "agent", command = "<string>" }. When topic_agents is unset, the
# default is a single truncate step with set_if = "empty" (today's truncation
# behaviour). Each step carries a set_if guard checked against @pop_topic_kind
# (empty | empty_or_seed | always). Provenance (seed | final) lives in
# @pop_topic_kind alongside the display slug @pop_topic. The truncate step runs
# synchronously in the prompt hook and writes the seed; the agent-step chain is
# then enqueued on the pop monitor daemon and runs on the daemon (not in the
# hook), upgrading the Topic to final when an agent step lands, with per-pane
# single-flight so set_if = "always" regeneration can't pile up overlapping
# model calls. When the monitor TCP server is off the agent steps fall back to
# running synchronously in the hook.
#
# Curated agent commands:
#   "claude"          -> claude -p --output-format json (result text extracted)
#   "ollama:<model>"  -> a local ollama model, e.g. "ollama:llama3.2"
#   "cmd:<command>"   -> escape hatch: any CLI, run via `sh -c`, fed pop's
#                        per-derive JSON payload on stdin (alias "sh:")
# Agent steps may also set `args = ["..."]` (appended to the curated argv) and
# `timeout = <seconds>` (overriding the global topic_derivation_timeout). The
# cmd: payload includes `prev_topic_kind` (`seed`/`final`/empty) alongside
# `prev_topic` so scripts know what they are replacing.
#
# topic_agents = [
#   { type = "truncate", set_if = "empty" },
#   { type = "agent", command = "claude", set_if = "empty_or_seed" },
#   { type = "agent", command = "ollama:gemma4:e4b", args = ["--thinking", "no"], timeout = 120 },
# ]
# topic_agents = ["claude", "ollama:llama3.2"]  # back-compat bare strings
#
# Word cap applied to a derived Topic after it is normalized into a lowercase
# kebab slug (e.g. debugging-auth-middleware). Defaults to 5.
# topic_words = 5
#
# Per-recipe timeout, in seconds, for a topic_agents agent step, after which
# pop kills it and falls through to the next recipe (then to prompt
# truncation). Large local models (e.g. a multi-GB ollama model that must
# cold-load) need more than the default of 30.
# topic_derivation_timeout = 30

# [updates]
# Gate the picker Update notice and the daily background update check.
# When false, pop makes zero automatic network calls — an explicit
# `pop doctor` run becomes the only update check (doctor always checks live).
# Defaults to true.
# notice_enabled = true

# [work.daemon]
# Supervisor timing for `pop work daemon`. Agent selection is configured under
# [work.implement].agents (see below), not in this section.
# poll_interval = "60s"
# Ceiling for a quota refusal that named no window class; a refusal that names
# one is dated from that window's span instead. Defaults to 5h, the shortest
# window a subscription has.
# agent_quota_retry_after = "5h"
# crash_retry_delays = ["1m", "5m", "15m"]

# Per-agent effort ladders map task effort to ordered { model, reasoning }
# entries. reasoning is optional; a model-only entry resolves just --model.
# Built-in ladders exist for claude/codex/cursor/pi/kimi; configuring an agent
# here fully replaces that agent's built-in ladder.
# [effort.opencode]
# heavy = [{ model = "opencode/claude-opus-4-8", reasoning = "high" }]
# standard = [{ model = "opencode/claude-sonnet-4-6", reasoning = "medium" }]
# light = [{ model = "opencode/kimi-k2.6" }]
#
# kimi resolves --model by exact provider-config key, so its built-in ladder
# names the standard-login aliases (heavy moonshot-ai/kimi-k3 @high, standard
# the same model @low, light moonshot-ai/kimi-k2.7-code-highspeed, model-only).
# Override here if your install names them differently, e.g. the managed
# kimi-code/ prefix. kimi has no reasoning flag: reasoning is passed as
# KIMI_MODEL_THINKING_EFFORT on the invocation, which bypasses kimi's own
# validation — pair only levels the model supports (k3: low/high/max), or a
# request 400s. A KIMI_MODEL_THINKING_EFFORT already set in your environment
# wins over the ladder's. A ladder model your subscription lacks (kimi answers
# "does not have access to ...") is not a task failure: the attempt falls
# through to the next agent in the list, records no cooldown, and probes kimi
# again on the next run.
# [effort.kimi]
# heavy = [{ model = "kimi-code/k3", reasoning = "max" }]
# standard = [{ model = "kimi-code/k3", reasoning = "high" }]
# light = [{ model = "kimi-code/k2.7-code" }]

# Settings keyed by agent preset rather than by kind of work. Includable, merged
# per preset, so a machine-local include can set one agent's block without
# erasing another's. After ADR-0195 the only key left is output — an attended
# session's whole invocation lives in its [work.attended].agents entry.
#
# output selects how pop reads this preset's stream ("auto" by default). "text"
# suppresses the adapter's stream-JSON flags entirely, and with them usage, cost,
# turn counts and Agent proceed verdict detection — it is the in-config
# workaround when a vendor changes a stream shape and pop's parser breaks.
# [agents.claude]
# output = "auto"

# Every agent list and every task-execution setting is grouped by kind of work
# under [work] (ADR-0194). There are no shared defaults at the [work] root: each
# kind that retries declares its own cap and schedule.
#
# Every group's agents list takes the same entry type: a table with a
# display_name (what pop calls the entry) and a cmd (the whole agent-CLI command,
# passed through untouched). A bare string is sugar for { cmd = "<string>" }, so
# the two spellings below are the same list. `pop tasks agents` names each entry,
# the preset it selects, and the model its command pins.
# agents = ["claude --model opus"]
# agents = [{ display_name = "Claude Usual", cmd = "claude --model opus" }]
#
# [work.implement]
# The unattended coding drain. Delays apply between retry-eligible failures;
# attempt 1 still starts immediately. Omitted attempt_retry_delays ⇒
# ["1m", "5m", "15m"]; an empty list restores instant retries (useful for
# tests/local dev). The last delay repeats when retries exceed the list length.
# agents = ["claude", "codex"]
# max_tries = 3
# attempt_retry_delays = ["1m", "5m", "15m"]
#
# [work.verify]
# The Verifier (ADR-0086). `enabled` is the master opt-in switch: absent/false
# means the Verifier never runs and status derives from the manifest alone.
# An omitted agents list falls back to [work.implement].agents. `effort`
# selects the Verifier's model-strength tier (light, standard, or heavy);
# absent defaults to heavy. `max_remediation_depth` bounds the
# verify->remediate->re-verify loop: a FIXABLE verdict spawns a Remediation
# task only while the set is under this many cycles, after which it parks at
# VERIFY-FAILED; a value <= 0 disables remediation.
# enabled = false
# agents = ["claude"]
# effort = "heavy"
# max_remediation_depth = 3
# max_tries = 3
# attempt_retry_delays = ["1m", "5m", "15m"]
#
# [work.review]
# The Reviewer (ADR-0214): a fresh agent reads the changeset against this
# repository's code-review convention and writes a document. It reaches no
# verdict and gates nothing. `enabled` arms automatic review at AFK quiescence;
# `pop tasks review <set>` runs on demand either way. An omitted agents list
# falls back to [work.implement].agents.
# enabled = false
# agents = ["claude"]
# effort = "heavy"
#
# [work.routine]
# Recurring Routine runs. A Routine manifest's own agents beats this group; an
# empty list falls through to [work.implement].agents.
# agents = ["claude"]
#
# [work.attended]
# Every session pop opens for a human shares this one list — gate assistance, an
# Assist session, Map assist, map grilling, a Routine refinement session. The
# entry's cmd is the whole invocation (model included); pop appends the preset's
# declared posture flag only where cmd does not already name it (ADR-0195). Two
# entries may name the same preset at different models.
# agents = [
#   { display_name = "Claude Usual", cmd = "claude --model opus" },
#   { display_name = "Claude Cheap", cmd = "claude --model haiku" },
#   "codex",
# ]

# [[work.dashboard.tasks.presets]]
# Work view presets for the Work dashboard (ADR-0197). A declared list
# (including empty) replaces pop's shipped roster wholesale; the first entry
# is the default view, and entries 1-9 get digit shortcuts. Reference a
# shipped preset by name with { system = "<name>" }, or declare fields
# directly. Fields AND-combine; `hide` subtracts its match from the result.
# name = "active"
# muted = false
# [work.dashboard.tasks.presets.hide]
# status = ["done"]
# unfolded = false
#
# [[work.dashboard.tasks.presets]]
# system = "recent-7d"

# [work.implement.git]
# Commit-time git config applied ONLY to pop's own commits during a task drain
# (the implementation commit and the commit-and-continue dirty checkpoint). Each
# entry is a git `-c`-style `key=value` string, prepended as a `-c key=value`
# pair. Absent/empty ⇒ commits behave exactly as today. Use this to disable GPG
# signing so an unattended queue drain never hangs on a 1Password presence
# prompt. Your own `~/.gitconfig` and pop's other git calls are unaffected.
# commit_config_overrides = ["commit.gpgsign=false"]

# [monitor.dashboard]
# Initial cursor strategy. Available: "current_registered", "current_any",
# "first_active". "current_any" adds the current pane as a virtual clear entry
# when it is not monitored, without registering it in the monitor state.
# cursor_position = "current_registered"
#
# Sort criteria chain. Each criterion is applied in order; the first that
# distinguishes two panes wins. Available: "status", "pane_last_active_at",
# "session_last_visit_at", "alphabetical"
# sort_criteria = ["status", "pane_last_active_at", "alphabetical"]
#
# When you select a pane from the dashboard, pop maximizes (zooms) it within
# its window. Set this to false to focus the pane in place instead, keeping the
# window's split layout visible (e.g. an editor above, an agent below).
# zoom_on_switch = true
#
# C-x on the dashboard destroys the cursored pane and drops it from the
# monitored set. It asks y/N first; set this to false to make the key kill
# immediately. The prompt is what stands between you and killing a pane whose
# agent keeps running without it, so turn it off knowingly.
# kill_pane_prompt_enabled = true

# [dashboard]
# Deprecated: use [monitor.dashboard] above instead. Still read when
# [monitor.dashboard] is absent; a key set in both wins from [monitor.dashboard].
